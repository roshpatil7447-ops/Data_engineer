verified_queries:
  - name: 0;1
    question: What is the total revenue and number of transactions?
    sql: SELECT SUM(NET_TOTAL) AS total_revenue, COUNT(DISTINCT TRANSACTION_ID) AS
      total_transactions FROM fact_sales_header
    verified_at: 1791455595
    verified_by: Semantic Model Generator
  - name: 1;1
    question: What is the monthly revenue trend?
    sql: SELECT d.MONTH_NAME, d.YEAR_NUM, SUM(fh.NET_TOTAL) AS monthly_revenue FROM
      fact_sales_header AS fh JOIN dim_date AS d ON fh.TRANSACTION_DATE = d.CAL_DATE
      GROUP BY d.MONTH_NAME, d.YEAR_NUM, d.MONTH_NUM ORDER BY d.YEAR_NUM, d.MONTH_NUM
    verified_at: 1791455595
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What are the top 10 stores by revenue?
    sql: SELECT s.STORE_NAME, s.COUNTRY_CODE, SUM(fh.NET_TOTAL) AS store_revenue,
      COUNT(DISTINCT fh.TRANSACTION_ID) AS transactions FROM fact_sales_header AS
      fh JOIN dim_store AS s ON fh.STORE_CODE = s.STORE_CODE AND s.IS_CURRENT = TRUE
      GROUP BY s.STORE_NAME, s.COUNTRY_CODE ORDER BY store_revenue DESC LIMIT 10
    verified_at: 1791455595
    verified_by: Semantic Model Generator
  - name: 3;1
    question: What is the revenue and units sold by product category?
    sql: SELECT p.CATEGORY_NAME, SUM(fi.LINE_TOTAL) AS category_revenue, SUM(fi.QUANTITY)
      AS units_sold FROM fact_sales_item AS fi JOIN dim_product AS p ON fi.SKU_CODE
      = p.SKU_CODE AND p.IS_CURRENT = TRUE GROUP BY p.CATEGORY_NAME ORDER BY category_revenue
      DESC
    verified_at: 1791455595
    verified_by: Semantic Model Generator
  - name: 4;1
    question: How does revenue break down by customer segment and loyalty tier?
    sql: SELECT c.CUSTOMER_SEGMENT, c.LOYALTY_TIER, COUNT(DISTINCT fh.CUSTOMER_ID)
      AS customers, SUM(fh.NET_TOTAL) AS segment_revenue, IFF(COUNT(DISTINCT fh.TRANSACTION_ID)
      = 0 OR COUNT(DISTINCT fh.TRANSACTION_ID) IS NULL, 0, SUM(fh.NET_TOTAL) / COUNT(DISTINCT
      fh.TRANSACTION_ID)) AS avg_order_value FROM fact_sales_header AS fh JOIN dim_customer
      AS c ON fh.CUSTOMER_ID = c.CUSTOMER_ID AND c.IS_CURRENT = TRUE GROUP BY c.CUSTOMER_SEGMENT,
      c.LOYALTY_TIER ORDER BY segment_revenue DESC
    verified_at: 1791455595
    verified_by: Semantic Model Generator
  - name: 5;1
    question: What is the revenue split by sales channel?
    sql: SELECT CHANNEL_ID, SUM(TOTAL_NET_REVENUE) AS channel_revenue, SUM(TRANSACTION_COUNT)
      AS transactions FROM agg_sales_monthly GROUP BY CHANNEL_ID ORDER BY channel_revenue
      DESC
    verified_at: 1791455595
    verified_by: Semantic Model Generator
  - name: 6;1
    question: Show me a monthly summary of revenue, customers and transactions
    sql: SELECT YEAR_MONTH_LABEL, SUM(TOTAL_NET_REVENUE) AS revenue, SUM(UNIQUE_CUSTOMERS)
      AS customers, SUM(TRANSACTION_COUNT) AS transactions FROM agg_sales_monthly
      GROUP BY YEAR_MONTH_LABEL ORDER BY YEAR_MONTH_LABEL
    verified_at: 1791455595
    verified_by: Semantic Model Generator
  - name: 7;1
    question: What is the revenue by country and region?
    sql: SELECT cn.COUNTRY_NAME, cn.REGION_NAME, SUM(fh.NET_TOTAL) AS country_revenue
      FROM fact_sales_header AS fh JOIN dim_country AS cn ON fh.COUNTRY_CODE = cn.COUNTRY_CODE
      AND cn.IS_CURRENT = TRUE GROUP BY cn.COUNTRY_NAME, cn.REGION_NAME ORDER BY country_revenue
      DESC
    verified_at: 1791455595
    verified_by: Semantic Model Generator